name: Container rental CI
on:
  workflow_dispatch:
  push:
    paths: ['Daily_Ai_004_Futain0857 system/container-rental-app-v1/**', 'Daily_Ai_004_Futain0857 system/apps-script/**', 'Daily_Ai_004_Futain0857 system/CLAUDE.md', '.github/workflows/container-rental-ci.yml']
  pull_request:
    paths: ['Daily_Ai_004_Futain0857 system/container-rental-app-v1/**', 'Daily_Ai_004_Futain0857 system/apps-script/**', 'Daily_Ai_004_Futain0857 system/CLAUDE.md', '.github/workflows/container-rental-ci.yml']
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Daily_Ai_004_Futain0857 system/container-rental-app-v1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: 'Daily_Ai_004_Futain0857 system/container-rental-app-v1/package-lock.json' }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      
      - name: Verify Apps Script files exist
        run: |
          test -f "../apps-script/Code.gs"
          test -f "../apps-script/Router.gs"
          test -f "../apps-script/Setup.gs"
          test -f "../apps-script/Auth.gs"
          test -f "../apps-script/RentalsService.gs"
          
      - name: Check for credential and Spreadsheet ID leaks
        run: |
          # 1. Search for potential Spreadsheet ID (44 character string starting with 1)
          if grep -rnE "1[a-zA-Z0-9_-]{43}" ../apps-script/ ../container-rental-app-v1/src/; then
            echo "Error: Potential Spreadsheet ID found in source code!"
            exit 1
          fi
          # 2. Search for raw Web App URL (script.google.com/macros/s/...)
          if grep -rn "script.google.com/macros/s/" ../apps-script/ ../container-rental-app-v1/src/; then
            echo "Error: Apps Script Web App URL found in source code!"
            exit 1
          fi
          # 3. Search for potential PASSWORD_HASH assignment (64 character hex string)
          if grep -rnE "[0-9a-fA-F]{64}" ../apps-script/ ../container-rental-app-v1/src/; then
            echo "Error: Potential PASSWORD_HASH found in source code!"
            exit 1
          fi
